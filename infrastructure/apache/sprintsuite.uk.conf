# sprintsuite.uk :443 — REFERENCE MIRROR of the live IONOS vhost.
#
# ⚠ THE LIVE FILE IS AUTHORITATIVE, NOT THIS ONE.
#    Live: /etc/apache2/sites-enabled/sprintsuite-le-ssl.conf on 194.164.124.172.
#    Nothing applies this file. It exists so the config can be rebuilt and
#    reviewed, and so the rules below are not discoverable only as prose in a
#    README. This project has been bitten by live-vs-repo config drift before —
#    if you change one, change both, and verify with the smoke check at the end.
#
# WHY THIS FILE EXISTS AT ALL:
#    The hub's landing page has a tile linking to /sprintsight-coming-soon/intro/.
#    That page is served by Apache from marketing/public — NOT by the hub. Without
#    the two rules below, the link lands on the hub's 404 and every test in the
#    repo still passes, because no unit test can see an Apache vhost. The tile is
#    the flagship of the app grid; it failing silently is the whole risk.
#
# Alias deployed and verified 2026-07-17. Backup of the pre-change file:
# /root/sprintsuite-vhost.bak
#
# DEPLOYING A CHANGE TO THIS FILE — both steps, in this order:
#   1. sudo apache2ctl configtest   (an unclosed <Directory> is Syntax OK to
#      every test in this repo, and fails at reload leaving the OLD config live)
#   2. bash infrastructure/smoke-sprintsuite.sh
# Step 2 is the only thing that can tell you whether the live file matches this
# one — it reads the expected header values out of THIS file and compares them
# against the running server. Ask it rather than trusting a comment here: a
# note claiming what is or is not deployed is true until the next deploy.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sprintsuite.uk
    ServerAlias www.sprintsuite.uk

    ProxyPreserveHost On
    ProxyRequests Off

    # mod_proxy_http auto-sets X-Forwarded-For and X-Forwarded-Host but not
    # X-Forwarded-Proto, so we set it. TLS terminates HERE: the browser spoke
    # https even though the hop to 127.0.0.1:3004 is plain http, and this header
    # reports the browser's scheme, not the hop's. It must stay "https".
    #
    # Deleting the line is not the alternative — with no header at all Express
    # falls back to the loopback hop and req.protocol reads http again, the same
    # wrong answer with nothing on screen to explain it.
    RequestHeader set X-Forwarded-Proto "https"

    # --- Sprintsight coming-soon page (static, served from marketing/public) ---
    #
    # ORDER IS LOAD-BEARING. Both lines must sit ABOVE the catch-all ProxyPass /
    # below. Apache matches ProxyPass rules in order and takes the first hit, so
    # without the `!` exclusion the hub's catch-all swallows the path and the
    # Alias never runs.
    #
    # Aliased at /intro rather than the parent on purpose: the parent
    # /sprintsight-coming-soon/ then falls through to the hub's 404 instead of
    # serving a directory listing (apache2.conf grants /var/www/ `Options Indexes`).
    #
    # No <Directory> block needed — apache2.conf already has `Require all granted`
    # for /var/www/.
    #
    # NOTE: the page also requests /css/instrument-core.css, /illos/glyphs.svg and
    # /fonts/* absolutely, which the HUB serves. They are byte-identical across
    # surfaces (check-theme-drift.mjs guarantees it), so this is correct — but it
    # means the promo page loses its styling if the hub is down.
    ProxyPass /sprintsight-coming-soon/intro !
    Alias /sprintsight-coming-soon/intro /var/www/suite/marketing/public/sprintsight-coming-soon/intro

    # The Alias above is exactly why this block has to exist. Bypassing the hub's
    # ProxyPass is what makes the page reachable — and it also means
    # hub/middleware/securityHeaders.js never runs on it, so before this block the
    # page shipped with no CSP, no HSTS and no frame protection at all. A ZAP scan
    # on 2026-08-25 found all four; marketing/tests/promo-security-headers.test.mjs
    # now asserts these values still match the hub's middleware.
    #
    # `always`, not the default: a 404 under this path (a mistyped asset) is
    # otherwise served bare. `<Directory>` rather than `<Location>` because Alias
    # maps into the filesystem, and this is the path it maps to.
    #
    # style-src is the ONE place this policy deviates from the hub's DEFAULT_CSP:
    # it carries a hash for the page's single <noscript><style> block instead of
    # 'unsafe-inline'. Change that block in index.html and the hash MUST move with
    # it — the test recomputes it from the file and will go red if you forget.
    #
    # If a style ever appears not to apply, the fix is a CLASS IN sight.css. It is
    # never 'unsafe-inline', and never 'unsafe-hashes' — which is strictly weaker
    # than the 'unsafe-inline' this replaced, because it re-enables every style
    # attribute on the page. The symptom is a silent visual bug with no console
    # error anyone here can see, so it will be tempting. The test rejects both.
    <Directory /var/www/suite/marketing/public/sprintsight-coming-soon/intro>
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-iD8k0jCdqBYRKwrrKQzwUIGS+ZrxRcaxrYUTJ9XfRL0='; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()"
    </Directory>

    ProxyPass        / http://127.0.0.1:3004/
    ProxyPassReverse / http://127.0.0.1:3004/

    # Hub form posts are tiny; cap at 256KB to keep abuse footprint low.
    LimitRequestBody 262144

    ErrorLog  ${APACHE_LOG_DIR}/sprintsuite-error.log
    CustomLog ${APACHE_LOG_DIR}/sprintsuite-access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/sprintsuite.uk/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/sprintsuite.uk/privkey.pem
</VirtualHost>
</IfModule>

# --- SMOKE CHECK (run on prod after any deploy that touches this vhost) ---
#
#   bash /var/www/suite/infrastructure/smoke-sprintsuite.sh
#
# It is the only thing that can catch a missing Alias. The hub's test suite
# cannot: it never sees Apache, and landing-assets.test.js skips this href
# because its regex requires a file extension and the URL ends in a slash.
